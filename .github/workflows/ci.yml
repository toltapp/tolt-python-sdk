name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install build pytest
      - run: python -m build
      - name: Check the wheel ships py.typed and no tests
        run: |
          python - <<'PY'
          import glob, zipfile
          names = zipfile.ZipFile(glob.glob("dist/*.whl")[0]).namelist()
          assert "tolt/py.typed" in names, "py.typed missing"
          assert not [n for n in names if n.startswith("tolt/tests/") or n.endswith(".md")], "tests or docs in wheel"
          PY
      - run: pip install dist/*.whl
      - run: pytest -q tests

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . mypy
      - run: mypy src/tolt --exclude src/tolt/tests
      - name: Type-check a caller against the installed package
        run: |
          cd "$RUNNER_TEMP"
          printf 'from tolt import ToltApi\n\nclient = ToltApi(token="x")\n' > caller.py
          mypy --strict caller.py
