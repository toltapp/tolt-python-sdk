[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tolt"
version = "0.1.0"
description = "Python SDK for the Tolt Public API"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
dependencies = [
  "httpx>=0.21.2",
  "pydantic>=1.9.2",
  "typing_extensions>=4.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tolt"]
